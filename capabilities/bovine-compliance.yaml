naftiko: 1.0.0-alpha2
info:
  label: "Chick-fil-A BOVINE API \u2014 Compliance"
  description: 'Compliance surface of the Chick-fil-A BOVINE AWS governance API. 3 operations. Lead operation: List Compliance Rules. Self-contained Naftiko capability covering one Chick-fil-A business
    surface.'
  tags:
  - Chick-fil-A
  - BOVINE
  - Compliance
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    BOVINE_TOKEN: BOVINE_TOKEN
capability:
  consumes:
  - type: http
    namespace: bovine-compliance
    baseUri: https://api.example.com
    description: "Chick-fil-A BOVINE API \u2014 Compliance business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.BOVINE_TOKEN}}'
    resources:
    - name: api-rules
      path: /api/rules
      operations:
      - name: getComplianceRules
        method: GET
        description: Chick-fil-A List Compliance Rules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-reports
      path: /api/reports
      operations:
      - name: getReports
        method: GET
        description: Chick-fil-A List Compliance Reports
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-reports-run
      path: /api/reports/run
      operations:
      - name: runReport
        method: GET
        description: Chick-fil-A Run Compliance Audit Report
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: bovine-compliance-rest
    port: 8080
    description: "REST adapter for Chick-fil-A BOVINE API \u2014 Compliance. One Spectral-compliant resource per consumed operation, prefixed with /v1."
    resources:
    - path: /v1/rules
      name: rules
      description: REST surface for Chick-fil-A List Compliance Rules.
      operations:
      - method: GET
        name: getComplianceRules
        description: Chick-fil-A List Compliance Rules
        call: bovine-compliance.getComplianceRules
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/reports
      name: reports
      description: REST surface for Chick-fil-A List Compliance Reports.
      operations:
      - method: GET
        name: getReports
        description: Chick-fil-A List Compliance Reports
        call: bovine-compliance.getReports
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/reports-run
      name: reports-run
      description: REST surface for Chick-fil-A Run Compliance Audit Report.
      operations:
      - method: GET
        name: runReport
        description: Chick-fil-A Run Compliance Audit Report
        call: bovine-compliance.runReport
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: bovine-compliance-mcp
    port: 9090
    transport: http
    description: "MCP adapter for Chick-fil-A BOVINE API \u2014 Compliance. One tool per consumed operation, routed inline through this capability's consumes block."
    tools:
    - name: list-compliance-rules
      description: Chick-fil-A List Compliance Rules
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bovine-compliance.getComplianceRules
      outputParameters:
      - type: object
        mapping: $.
    - name: list-compliance-reports
      description: Chick-fil-A List Compliance Reports
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bovine-compliance.getReports
      outputParameters:
      - type: object
        mapping: $.
    - name: run-compliance-audit-report
      description: Chick-fil-A Run Compliance Audit Report
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bovine-compliance.runReport
      outputParameters:
      - type: object
        mapping: $.
