naftiko: 1.0.0-alpha2
info:
  label: "Chick-fil-A BOVINE API \u2014 Compute"
  description: 'Compute surface of the Chick-fil-A BOVINE AWS governance API. 3 operations. Lead operation: List Public IPs. Self-contained Naftiko capability covering one Chick-fil-A business surface.'
  tags:
  - Chick-fil-A
  - BOVINE
  - Compute
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    BOVINE_TOKEN: BOVINE_TOKEN
capability:
  consumes:
  - type: http
    namespace: bovine-compute
    baseUri: https://api.example.com
    description: "Chick-fil-A BOVINE API \u2014 Compute business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.BOVINE_TOKEN}}'
    resources:
    - name: api-publicips
      path: /api/publicips
      operations:
      - name: getPublicIps
        method: GET
        description: Chick-fil-A List Public IPs
        inputParameters:
        - name: account
          in: query
          type: string
          required: true
          description: The AWS account number (12-digit) or account alias to scope the request to.
        - name: region
          in: query
          type: string
          required: false
          description: The AWS region to scope the request to.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-instances
      path: /api/instances
      operations:
      - name: getInstances
        method: GET
        description: Chick-fil-A List EC2 Instances
        inputParameters:
        - name: account
          in: query
          type: string
          required: true
          description: The AWS account number (12-digit) or account alias to scope the request to.
        - name: region
          in: query
          type: string
          required: false
          description: The AWS region to scope the request to.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-instance
      path: /api/instance
      operations:
      - name: getInstance
        method: GET
        description: Chick-fil-A Get EC2 Instance
        inputParameters:
        - name: account
          in: query
          type: string
          required: true
          description: The AWS account number (12-digit) or account alias to scope the request to.
        - name: instance
          in: query
          type: string
          required: true
          description: The EC2 instance ID to look up.
        - name: region
          in: query
          type: string
          required: false
          description: The AWS region to scope the request to.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: bovine-compute-rest
    port: 8080
    description: "REST adapter for Chick-fil-A BOVINE API \u2014 Compute. One Spectral-compliant resource per consumed operation, prefixed with /v1."
    resources:
    - path: /v1/publicips
      name: publicips
      description: REST surface for Chick-fil-A List Public IPs.
      operations:
      - method: GET
        name: getPublicIps
        description: Chick-fil-A List Public IPs
        call: bovine-compute.getPublicIps
        with:
          account: rest.account
          region: rest.region
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/instances
      name: instances
      description: REST surface for Chick-fil-A List EC2 Instances.
      operations:
      - method: GET
        name: getInstances
        description: Chick-fil-A List EC2 Instances
        call: bovine-compute.getInstances
        with:
          account: rest.account
          region: rest.region
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/instance
      name: instance
      description: REST surface for Chick-fil-A Get EC2 Instance.
      operations:
      - method: GET
        name: getInstance
        description: Chick-fil-A Get EC2 Instance
        call: bovine-compute.getInstance
        with:
          account: rest.account
          instance: rest.instance
          region: rest.region
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: bovine-compute-mcp
    port: 9090
    transport: http
    description: "MCP adapter for Chick-fil-A BOVINE API \u2014 Compute. One tool per consumed operation, routed inline through this capability's consumes block."
    tools:
    - name: list-public-ips
      description: Chick-fil-A List Public IPs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bovine-compute.getPublicIps
      with:
        account: tools.account
        region: tools.region
      outputParameters:
      - type: object
        mapping: $.
    - name: list-ec2-instances
      description: Chick-fil-A List EC2 Instances
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bovine-compute.getInstances
      with:
        account: tools.account
        region: tools.region
      outputParameters:
      - type: object
        mapping: $.
    - name: get-ec2-instance
      description: Chick-fil-A Get EC2 Instance
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bovine-compute.getInstance
      with:
        account: tools.account
        instance: tools.instance
        region: tools.region
      outputParameters:
      - type: object
        mapping: $.
