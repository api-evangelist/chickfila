naftiko: 1.0.0-alpha2
info:
  label: "Chick-fil-A BOVINE API \u2014 Summary"
  description: 'Summary surface of the Chick-fil-A BOVINE AWS governance API. 3 operations. Lead operation: Get Account Count. Self-contained Naftiko capability covering one Chick-fil-A business surface.'
  tags:
  - Chick-fil-A
  - BOVINE
  - Summary
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    BOVINE_TOKEN: BOVINE_TOKEN
capability:
  consumes:
  - type: http
    namespace: bovine-summary
    baseUri: https://api.example.com
    description: "Chick-fil-A BOVINE API \u2014 Summary business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.BOVINE_TOKEN}}'
    resources:
    - name: api-summary-accountcount
      path: /api/summary/accountcount
      operations:
      - name: getAccountCount
        method: GET
        description: Chick-fil-A Get Account Count
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-summary-usercount
      path: /api/summary/usercount
      operations:
      - name: getUserCount
        method: GET
        description: Chick-fil-A Get User Count
        inputParameters:
        - name: account
          in: query
          type: string
          required: true
          description: The AWS account number (12-digit) or account alias to scope the request to.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-summary-instancecount
      path: /api/summary/instancecount
      operations:
      - name: getInstanceCount
        method: GET
        description: Chick-fil-A Get Instance Count
        inputParameters:
        - name: account
          in: query
          type: string
          required: true
          description: The AWS account number (12-digit) or account alias to scope the request to.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: bovine-summary-rest
    port: 8080
    description: "REST adapter for Chick-fil-A BOVINE API \u2014 Summary. One Spectral-compliant resource per consumed operation, prefixed with /v1."
    resources:
    - path: /v1/summary-accountcount
      name: summary-accountcount
      description: REST surface for Chick-fil-A Get Account Count.
      operations:
      - method: GET
        name: getAccountCount
        description: Chick-fil-A Get Account Count
        call: bovine-summary.getAccountCount
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/summary-usercount
      name: summary-usercount
      description: REST surface for Chick-fil-A Get User Count.
      operations:
      - method: GET
        name: getUserCount
        description: Chick-fil-A Get User Count
        call: bovine-summary.getUserCount
        with:
          account: rest.account
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/summary-instancecount
      name: summary-instancecount
      description: REST surface for Chick-fil-A Get Instance Count.
      operations:
      - method: GET
        name: getInstanceCount
        description: Chick-fil-A Get Instance Count
        call: bovine-summary.getInstanceCount
        with:
          account: rest.account
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: bovine-summary-mcp
    port: 9090
    transport: http
    description: "MCP adapter for Chick-fil-A BOVINE API \u2014 Summary. One tool per consumed operation, routed inline through this capability's consumes block."
    tools:
    - name: get-account-count
      description: Chick-fil-A Get Account Count
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bovine-summary.getAccountCount
      outputParameters:
      - type: object
        mapping: $.
    - name: get-user-count
      description: Chick-fil-A Get User Count
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bovine-summary.getUserCount
      with:
        account: tools.account
      outputParameters:
      - type: object
        mapping: $.
    - name: get-instance-count
      description: Chick-fil-A Get Instance Count
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bovine-summary.getInstanceCount
      with:
        account: tools.account
      outputParameters:
      - type: object
        mapping: $.
