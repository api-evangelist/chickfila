naftiko: 1.0.0-alpha2
info:
  label: "Chick-fil-A BOVINE API \u2014 System"
  description: 'System surface of the Chick-fil-A BOVINE AWS governance API. 3 operations. Lead operation: Ping the BOVINE Service. Self-contained Naftiko capability covering one Chick-fil-A business surface.'
  tags:
  - Chick-fil-A
  - BOVINE
  - System
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    BOVINE_TOKEN: BOVINE_TOKEN
capability:
  consumes:
  - type: http
    namespace: bovine-system
    baseUri: https://api.example.com
    description: "Chick-fil-A BOVINE API \u2014 System business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.BOVINE_TOKEN}}'
    resources:
    - name: api-ping
      path: /api/ping
      operations:
      - name: getPing
        method: GET
        description: Chick-fil-A Ping the BOVINE Service
        inputParameters:
        - name: operation
          in: query
          type: string
          required: false
          description: The named operation to dispatch.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: login
      path: /login
      operations:
      - name: getLogin
        method: GET
        description: Chick-fil-A Initiate Login
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-dashboard
      path: /api/dashboard
      operations:
      - name: getDashboard
        method: GET
        description: Chick-fil-A Get Dashboard Summary
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: bovine-system-rest
    port: 8080
    description: "REST adapter for Chick-fil-A BOVINE API \u2014 System. One Spectral-compliant resource per consumed operation, prefixed with /v1."
    resources:
    - path: /v1/ping
      name: ping
      description: REST surface for Chick-fil-A Ping the BOVINE Service.
      operations:
      - method: GET
        name: getPing
        description: Chick-fil-A Ping the BOVINE Service
        call: bovine-system.getPing
        with:
          operation: rest.operation
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/login
      name: login
      description: REST surface for Chick-fil-A Initiate Login.
      operations:
      - method: GET
        name: getLogin
        description: Chick-fil-A Initiate Login
        call: bovine-system.getLogin
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/dashboard
      name: dashboard
      description: REST surface for Chick-fil-A Get Dashboard Summary.
      operations:
      - method: GET
        name: getDashboard
        description: Chick-fil-A Get Dashboard Summary
        call: bovine-system.getDashboard
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: bovine-system-mcp
    port: 9090
    transport: http
    description: "MCP adapter for Chick-fil-A BOVINE API \u2014 System. One tool per consumed operation, routed inline through this capability's consumes block."
    tools:
    - name: ping-bovine-service
      description: Chick-fil-A Ping the BOVINE Service
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bovine-system.getPing
      with:
        operation: tools.operation
      outputParameters:
      - type: object
        mapping: $.
    - name: initiate-login
      description: Chick-fil-A Initiate Login
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bovine-system.getLogin
      outputParameters:
      - type: object
        mapping: $.
    - name: get-dashboard-summary
      description: Chick-fil-A Get Dashboard Summary
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bovine-system.getDashboard
      outputParameters:
      - type: object
        mapping: $.
